[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "captchahub"
version = "2.1.0"
description = "Enterprise CAPTCHA recognition platform - Flask + ddddocr web dashboard & REST API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["captcha", "ocr", "ddddocr", "flask", "recognition"]
authors = [
    {name = "K2st0r", email = "k2st0r@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ddddocr>=2.0.0",
    "flask>=3.0",
    "flask-cors>=4.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/K2st0r/captchahub"
Repository = "https://github.com/K2st0r/captchahub"
Donate = "https://github.com/K2st0r/captchahub#donate--打赏"
